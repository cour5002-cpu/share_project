<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>提交心得</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid app-container">
        <a class="navbar-brand" href="index.html">分享会资料</a>
        <div class="navbar-nav app-nav">
          <a class="nav-link" href="index.html">首页</a>
          <a class="nav-link" href="discussion.html">心得讨论页</a>
          <a class="nav-link" href="submit-resource.html">分享会资料提交页</a>
        </div>
      </div>
    </nav>

    <main class="container app-container py-4">
      <h1 class="h4 mb-2">提交心得</h1>
      <div class="text-secondary small mb-3">
        <div>分享会：<span class="fw-semibold" id="meetingTitle"></span></div>
        <div>主题讨论：<span id="meetingTopic"></span></div>
      </div>

      <div id="loading" class="alert alert-secondary d-none" role="alert">加载中...</div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>

      <div id="formWrap" class="d-none">
        <div id="submitStatus" class="alert alert-secondary" role="alert">待提交</div>

        <div class="card shadow-sm">
          <div class="card-body">
            <form id="reflectionForm" class="needs-validation" novalidate>
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label">姓名（必填）</label>
                  <input class="form-control" name="student_name" required />
                  <div class="invalid-feedback">请填写姓名。</div>
                </div>

                <div class="col-12 col-md-6">
                  <label class="form-label">班级（必填）</label>
                  <input class="form-control" name="class_name" required />
                  <div class="invalid-feedback">请填写班级。</div>
                </div>

                <div class="col-12">
                  <label class="form-label">我的观点（必填）</label>
                  <textarea class="form-control" name="content" rows="4" required></textarea>
                  <div class="invalid-feedback">请填写你的观点。</div>
                </div>

                <div class="col-12">
                  <label class="form-label">我的收获</label>
                  <textarea class="form-control" name="gain" rows="3"></textarea>
                </div>

                <div class="col-12">
                  <label class="form-label">我的疑问</label>
                  <textarea class="form-control" name="question" rows="3"></textarea>
                </div>

                <div class="col-12 d-flex gap-2">
                  <button id="submitBtn" class="btn btn-success" type="submit">提交</button>
                  <a class="btn btn-outline-secondary" href="index.html">返回首页</a>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="appModalTitle">提示</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="appModalBody"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-primary" data-bs-dismiss="modal">知道了</button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/submit-reflection.js"></script>
  </body>
</html>
