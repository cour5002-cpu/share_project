<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>分享会资料详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid app-container">
        <a class="navbar-brand" href="index.html">分享会资料</a>
        <div class="navbar-nav app-nav">
          <a class="nav-link" href="index.html">首页</a>
          <a class="nav-link" href="discussion.html">心得讨论页</a>
          <a class="nav-link" href="submit-resource.html">分享会资料提交页</a>
        </div>
      </div>
    </nav>

    <main class="container app-container py-4">
      <div class="mb-3">
        <a class="btn btn-outline-secondary" href="index.html">返回列表</a>
      </div>

      <div id="loading" class="alert alert-secondary d-none" role="alert">加载中...</div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>

      <div id="content" class="d-none">
        <div class="card shadow-sm">
          <div class="card-body">
            <h1 class="h4 mb-2" id="title"></h1>
            <div class="text-secondary small mb-3">
              <span id="speaker"></span>
              <span class="mx-2">|</span>
              <span id="speakerRole"></span>
              <span class="mx-2">|</span>
              <span id="date"></span>
            </div>

            <div class="mb-3">
              <div class="kv-label">一句话简介</div>
              <div class="kv-value" id="description"></div>
            </div>

            <div class="mb-3 link-btns d-flex flex-wrap gap-2">
              <div id="videoWrap"></div>
              <div id="pptWrap"></div>
            </div>

            <div class="mb-3">
              <div class="kv-label">主题讨论</div>
              <div class="kv-value" id="discussionTopic"></div>
            </div>

            <div class="mb-3">
              <div class="kv-label">备注</div>
              <div class="kv-value" id="remark"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/resource-detail.js"></script>
  </body>
</html>
